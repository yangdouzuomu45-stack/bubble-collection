<!doctype html><n<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吹き出しコレクション</title>
<style>
:root{font-family:system-ui,sans-serif;color:#29271f;background:#fff9e6}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#f5c400,#ffe98a);padding:24px 18px}main{max-width:760px;margin:auto;padding:16px}h1{margin:0;font-size:24px}h2{font-size:18px;margin:0 0 12px}.panel,.item{background:white;border:1px solid #e8dfc3;border-radius:16px;padding:16px;margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d9d1bc;border-radius:9px;font:inherit}textarea{min-height:65px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;background:#f3edda;cursor:pointer}.primary{background:#29271f;color:white;width:100%;margin-top:13px}.danger{background:#ffefeb;color:#a32d20}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar>*{flex:1;min-width:0}.item{margin:10px 0}.name{font-weight:800}.tag{display:inline-block;background:#fff0a8;border-radius:20px;padding:3px 9px;font-size:11px;margin:5px 0}.url{font-size:12px;overflow-wrap:anywhere;color:#625d50;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px}.empty{text-align:center;color:#777;padding:25px}.hint{font-size:12px;color:#777;line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style><body><header><h1>🎨 吹き出しコレクション</h1><div>ブラチャ用の吹き出しURLを保存・整理</div></header><main>
<section class="panel"><h2 id="formTitle">＋ 吹き出しを登録</h2><label>名前</label><input id="name" placeholder="例：ベガルタ・ユニフォーム柄"><div class="grid"><div><label>カテゴリ</label><select id="category"><option>ベガルタ</option><option>Jリーグ</option><option>グラデーション</option><option>その他</option></select></div><div><label>吹き出しURL・CSSコード</label><input id="url" placeholder="linear-gradient(...) "></div></div><label>メモ（任意）</label><textarea id="memo" placeholder="色やデザインのメモ"></textarea><button class="primary" id="save">保存する</button><p class="hint">保存データはこのブラウザ内に保存されます。定期的に「バックアップ保存」でファイルに書き出してください。</p></section>
<section class="panel"><h2>📚 保存した吹き出し <small id="count">0件</small></h2><div class="toolbar"><input id="search" placeholder="名前・URL・メモを検索"><select id="filter"><option value="">すべて</option><option>ベガルタ</option><option>Jリーグ</option><option>グラデーション</option><option>その他</option></select></div><div id="list"></div><div class="toolbar"><button id="export">バックアップ保存</button><button id="importBtn">バックアップ読込</button><input id="file" type="file" accept="application/json,.json" hidden></div></section></main>
<script>
const KEY='bubbleCollection_v1';let data=[];let editing=null;const $=id=>document.getElementById(id);try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch{data=[]}const saveData=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){editing=null;$('name').value=$('url').value=$('memo').value='';$('category').value='ベガルタ';$('formTitle').textContent='＋ 吹き出しを登録';$('save').textContent='保存する'}$('save').onclick=()=>{let name=$('name').value.trim(),url=$('url').value.trim();if(!name||!url){alert('名前とURLを入力してね');return}let item={id:editing||String(Date.now()),name,url,category:$('category').value,memo:$('memo').value.trim()};if(editing)data=data.map(x=>x.id===editing?item:x);else data.unshift(item);saveData();reset()};function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let a=data.filter(x=>(!f||x.category===f)&&[x.name,x.url,x.memo,x.category].join(' ').toLowerCase().includes(q));$('count').textContent=data.length+'件';$('list').innerHTML=a.length?a.map(x=>`<article class="item"><div class="name">${esc(x.name)}</div><span class="tag">${esc(x.category)}</span><div class="url">${esc(x.url)}</div>${x.memo?`<p class="hint">${esc(x.memo)}</p>`:''}<div class="actions"><button data-act="copy" data-id="${esc(x.id)}">URLをコピー</button><button data-act="edit" data-id="${esc(x.id)}">編集</button><button class="danger" data-act="del" data-id="${esc(x.id)}">削除</button></div></article>`).join(''):'<div class="empty">保存した吹き出しはまだありません</div>'} $('list').onclick=async e=>{let b=e.target.closest('button[data-act]');if(!b)return;let x=data.find(y=>y.id===b.dataset.id);if(!x)return;if(b.dataset.act==='copy'){try{await navigator.clipboard.writeText(x.url);b.textContent='コピー済み！'}catch{prompt('コピーしてね',x.url)}}if(b.dataset.act==='edit'){editing=x.id;$('name').value=x.name;$('url').value=x.url;$('category').value=x.category;$('memo').value=x.memo||'';$('formTitle').textContent='✏️ 編集';$('save').textContent='変更を保存';scrollTo({top:0,behavior:'smooth'})}if(b.dataset.act==='del'&&confirm('この吹き出しを削除する？')){data=data.filter(y=>y.id!==x.id);saveData();if(editing===x.id)reset()}};$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='吹き出しコレクション_backup.json';a.click();URL.revokeObjectURL(u)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let arr=JSON.parse(await f.text());if(!Array.isArray(arr)||!arr.every(x=>x.name&&x.url))throw 0;if(confirm('バックアップの内容を追加・更新する？')){arr.forEach(x=>{let i=data.findIndex(y=>y.id===x.id);if(i>=0)data[i]=x;else data.push(x)});saveData();alert('読み込みました')}}catch{alert('読み込めないファイルです')}e.target.value=''};render();
</script></body></html>
